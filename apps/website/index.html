<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore fossil discoveries by country and era with DinoSpotter."
    />
    <title>DinoSpotter — A fossil field guide</title>
  </head>
  <body>
    <header class="site-header">
      <a href="/">DinoSpotter<span>A fossil field guide</span></a>
    </header>
    <main id="app">
      <section id="map-panel" aria-label="Fossil map">
        <div id="globe" aria-label="Interactive fossil map"></div>
        <button id="back-to-globe" type="button" hidden>← Back to globe</button>
        <p id="hint">Modern borders · fossil sites at their present-day coordinates</p>
        <button id="load-globe">Explore the globe</button>
      </section>
      <aside id="drawer" aria-label="Fossil records">
        <h1>Explore the fossil record</h1>
        <p class="drawer-intro">Choose a country and an era to see what was found.</p>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
