<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore fossil discoveries by country and era with DinoSpotter."
    />
    <title>DinoSpotter — A fossil field guide</title>
  </head>
  <body>
    <div id="header-mount"></div>
    <main id="home" class="home-screen" hidden>
      <div id="home-globe" aria-hidden="true"></div>
      <div class="home-content">
        <h1>Find your local dinosaurs.</h1>
        <p>
          Explore fossil discoveries around the world, from dinosaurs and plants to life in ancient
          seas.
        </p>
        <a class="home-cta" href="/explore"
          >Get started <i data-lucide="arrow-up-right" aria-hidden="true"></i
        ></a>
      </div>
    </main>
    <main id="app">
      <section id="map-panel" aria-label="Fossil map">
        <div id="globe" aria-label="Interactive fossil map"></div>
        <button id="back-to-globe" type="button" hidden>
          <i data-lucide="arrow-left" aria-hidden="true"></i> Back to globe
        </button>
        <p id="hint">Findspots use modern coordinates</p>
      </section>
      <aside id="drawer" aria-label="Fossil records">
        <h1>Explore the fossil record</h1>
        <p class="drawer-intro">Choose a country and era to explore its fossil record.</p>
      </aside>
    </main>
    <div id="footer-mount"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
